<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/webp" href="Logo/Logo.webp" sizes="16x16">
    <script src="scripts/slider.js" defer></script> <!-- Defer - makes JS wait until the HTML elements exist -->
    <title>A1 Customs</title>
</head>
<body>
    <!-- Header Section -->
    <header>
         
        <h1 class="logo">{A1 Customs}</h1>
        
        <button class="header-button" style="position: absolute; right: 1cqw; top: 30cqh;">contact us</button>
        <button class="header-button" style="position: absolute; right: 6cqw; top: 30cqh;">about us</button>
        <button class="header-button" style="position: absolute; right: 10cqw; top: 30cqh;">
            <a href="bike-choose.html" style="text-decoration: none; color: inherit;">configurator</a>
        </button>
        
    </header>
    
    <!-- Hero Section -->
    <hero class="load-in">
        
        <div class="container" id="bike-slider" style="margin-top: 20px;">
            
            <img src="stock-bikes/stockshow.webp" alt="stock bike" id="stock-bike" class="stock-bike" width="1200" height="700" draggable="false">
            <img src="stock-bikes/modshow.webp" alt="modified bike" id="mod-bike" class="mod-bike" width="1200" height="700" draggable="false">
            
            <div class="slider-line" id="slider-line"></div>
            
            <p text-align="center" margin-top="0px" class="photo-text" >Fantic XMF 125 Performance</p>
            
        </div>
        
        <h2 class="centering">Make it yours</h2>
        <div class="cardcont">
           
           <div class="card" style="left: 20%;">
              <img class="cardimg" src="cards/exhaust-card.png" alt="exhaust card">
              <p class="cardtext">Exhausts</p>
           </div>

           <div class="card" style="left: 20%";>
              <img class="cardimg" src="cards/graphics-card.webp" alt="graphics-card">
              <p class="cardtext">Graphics</p>
           </div>

           <div class="card" style="left: 20%";>
              <img class="cardimg" src="cards/graphics-card.png" alt="graphics-card">
              <p class="cardtext">Grips</p>
           </div>

           <div class="card" style="left: 20%";>
              <img class="cardimg" src="cards/graphics-card.png" alt="graphics-card">
              <p class="cardtext">Mirrors</p>
           </div>

        </div>


        <h2 class="centering">customize your own</h4>
            
        <button class="modify-button"style="aspect-ratio: 17 / 8; width: 10vw; height: 5vw; border: 1px solid black; margin-bottom: 2%; container-type: size">
            <a href="bike-choose.html" style="text-decoration: none; color: inherit; padding-top: 15px; Padding-bottom: 15px; font-size: 18cqh">start customizing</a>
        </button>
    
        
    </hero>
    
    <!-- About Section -->
    <footer style="background-color: black; width: 100%; height: 10vh; text-align: center; color: white; container-type: size; margin: 0">
    
        <p style="padding-top: 13px; font-size: 30cqh;">© 2026 A1 Customs. All rights reserved.</p>

    </footer>
</body>








</html>
